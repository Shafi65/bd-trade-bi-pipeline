name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # The source publications are not in the repo, so CI runs the parser and
      # reconciliation-logic tests; the data-contract tests skip and run locally.
      - run: python -m pytest -q -rs
